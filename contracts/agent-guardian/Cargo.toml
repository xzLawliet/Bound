[package]
name = "agent-guardian"
version = "0.1.0"
edition = "2021"
authors = ["Bound"]
license = "MIT"
description = "Transparent on-chain spending policy for AI agents on NEAR"
repository = "https://github.com/xzLawliet/Bound"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { git = "https://github.com/near/near-sdk-rs", tag = "near-sdk-v5.17.2", default-features = false }

[dev-dependencies]
near-sdk = { git = "https://github.com/near/near-sdk-rs", tag = "near-sdk-v5.17.2", default-features = false, features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
